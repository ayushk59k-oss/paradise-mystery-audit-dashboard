name: Daily mystery audit check

on:
  schedule:
    # 11:00 AM IST = 05:30 UTC (India has no daylight saving, offset is fixed)
    - cron: '30 5 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the workflow can commit the updated hash file

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily check (screenshots + emails only if data changed)
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: npm run daily-check

      - name: Commit updated hash file (only runs if the hash actually changed)
        run: |
          git config user.name "paradise-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/last-hash.txt
          git diff --cached --quiet && echo "No hash change to commit." || (git commit -m "Update last-hash after new data detected" && git push)
